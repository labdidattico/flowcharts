<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diagramma consegnato</title>

    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="icona.svg" type="image/svg+xml">

    <link href="vendor/material-icons.css" rel="stylesheet">
    <link href="vendor/toastify.min.css" rel="stylesheet" type="text/css">
    <link href="flowrun.css" rel="stylesheet" type="text/css">

    <style>
      html, body { margin:0; padding:0; background:#fff; }
      .viewer-avviso {
        font-family: system-ui, sans-serif; font-size: 0.9rem; color:#555;
        padding: 12px 16px; border-bottom: 1px solid #e0e0e0;
        display:flex; gap: 8px; align-items: center;
      }
      .viewer-avviso .material-icons { font-size: 18px; color:#2f6fb0; }
      .viewer-errore {
        font-family: system-ui, sans-serif; font-size: 0.95rem; color:#a33;
        padding: 24px 16px;
      }
      /* sola lettura: nasconde i pulsanti di modifica residui della toolbar */
      .flowrun-readonly .flowrun-fun-chooser { pointer-events:none; }
    </style>
</head>

<body>
    <!-- template richiesto da FlowRunEditor (clonato sul mount point) -->
    <template id="flowrun-template">
        <div class="flowrun-functions-list flowrun--panel" style="display:none"></div>

        <div class="flowrun-diagram flowrun--panel">
            <div class="fr-toolbar">
                <span class="flowrun-draw-io-btns fr-gruppo">
                    <button class="flowrun-btn-load" title="Apri un diagramma da file"> <span class="material-icons">folder_open</span> </button>
                    <button class="flowrun-btn-download" title="Salva il diagramma su file"> <span class="material-icons">save</span> </button>
                    <button class="flowrun-btn-copy-source fr-nascosto" title="Copia il diagramma negli appunti"> <span class="material-icons">content_copy</span> </button>
                    <button class="flowrun-btn-paste-source fr-nascosto" title="Incolla un diagramma dagli appunti"> <span class="material-icons">content_paste</span> </button>
                    <button class="flowrun-btn-copy-dot fr-nascosto" title="Copia la descrizione DOT del disegno"> <span class="material-icons">account_tree</span> </button>
                </span>
                <span class="fr-sep"></span>
                <span class="flowrun-draw-exec-btns fr-gruppo">
                    <button class="flowrun-btn-run" title="Esegui tutto"> <span class="material-icons">play_arrow</span> </button>
                    <button class="flowrun-btn-run-step" title="Esegui un passo alla volta"> <span class="material-icons">skip_next</span> </button>
                    <button class="flowrun-btn-stop" title="Stop"> <span class="material-icons">stop</span> </button>
                </span>
                <span class="fr-sep"></span>
                <span class="flowrun-draw-zoom-btns fr-gruppo">
                    <button class="flowrun-btn-zoom-in" title="Ingrandisci"> <span class="material-icons">zoom_in</span> </button>
                    <button class="flowrun-btn-zoom-reset" title="Dimensione originale"> <span class="material-icons">fullscreen</span> </button>
                    <button class="flowrun-btn-zoom-out" title="Riduci"> <span class="material-icons">zoom_out</span> </button>
                </span>
                <span class="flowrun-draw-view-btns fr-gruppo">
                    <button class="flowrun-btn-add-stmt-menu" title="Aggiungi"> <span class="material-icons">add</span> </button>
                </span>
            </div>
            <div class="flowrun-draw-area"></div>
        </div>

        <div class="flowrun-code flowrun--panel"></div>
        <div class="flowrun-output flowrun--panel"></div>

        <div class="flowrun-insert-point-menu flowrun-context-menu"></div>
        <div class="flowrun-node-context-menu flowrun-context-menu"></div>
    </template>

    <div id="viewer-avviso" class="viewer-avviso" style="display:none">
        <span class="material-icons">info</span>
        <span id="viewer-nome">Diagramma</span>
    </div>
    <div id="viewer-errore" class="viewer-errore" style="display:none"></div>

    <!-- mount point: readonly + nascosto finché il programma non è caricato -->
    <div class="flowrun-instance flowrun-readonly flowrun--hidden" id="viewer-mount"></div>

    <!-- graphviz -->
    <script src="vendor/graphviz.umd.js"></script>
    <script src="vendor/d3.min.js"></script>
    <script src="vendor/d3-graphviz.min.js"></script>
    <!-- toastify (usato da FlowRunEditor per i messaggi) -->
    <script src="vendor/toastify-js.js"></script>

    <script src="scripts/compiled/main.js"></script>
    <script>
      /* Modalità viewer: carica il diagramma dal fragment dell'URL.
         URL: viewer.html#<base64url del JSON .flowrun>
         Il fragment NON viaggia verso il server: resta nel browser. */
      (function () {
        var raw = decodeURIComponent(window.location.hash.slice(1) || '');
        var mount = document.getElementById('viewer-mount');
        var errBox = document.getElementById('viewer-errore');
        var avviso = document.getElementById('viewer-avviso');
        if (!raw) {
          errBox.style.display = '';
          errBox.textContent = 'Nessun diagramma specificato: manca il dato nell\u2019URL.';
          return;
        }
        var json = null;
        try {
          // base64url -> JSON
          var b64 = raw.replace(/-/g, '+').replace(/_/g, '/');
          while (b64.length % 4) b64 += '=';
          json = decodeURIComponent(escape(atob(b64)));
          JSON.parse(json); // validazione
        } catch (e) {
          errBox.style.display = '';
          errBox.textContent = 'Il dato nell\u2019URL non \u00e8 un diagramma valido.';
          return;
        }
        window.addEventListener('load', function () {
          try {
            var nome = '';
            try { nome = JSON.parse(json).name || ''; } catch (e) {}
            if (nome) {
              document.getElementById('viewer-nome').textContent = nome;
              avviso.style.display = 'flex';
            }
            // I parametri delle classi esportate da Scala.js sono POSIZIONALI:
            // (mountElem, theme, programJson, mountCallback, changeCallback).
            // Passare un oggetto faceva finire l'oggetto stesso in mountElem
            // -> "mountElem.classList is undefined".
            var fr = new FlowRunEditor(
              mount,
              FlowRunThemeObj.default.withFontName('Courier Prime'),
              json
            );
            mount.classList.remove('flowrun--hidden');
            // il diagramma è dentro: adatta lo zoom al contenitore
            setTimeout(function () {
              try {
                var svg = mount.querySelector('.flowrun-draw-area svg');
                if (svg) {
                  var vb = svg.getAttribute('viewBox');
                  if (vb) {
                    var w = parseFloat(vb.split(' ')[2]);
                    var dispW = mount.querySelector('.flowrun-draw-area').clientWidth || 800;
                    var scala = Math.min(1, (dispW - 16) / w);
                    svg.setAttribute('width', (w * scala) + 'pt');
                  }
                }
              } catch (e) { /* zoom di default */ }
            }, 500);
          } catch (e) {
            errBox.style.display = '';
            errBox.textContent = 'Errore nel disegno del diagramma: ' + e.message;
            mount.classList.add('flowrun--hidden');
          }
        });
      })();
    </script>
</body>

</html>
